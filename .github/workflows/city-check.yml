name: City prototype checks
on:
  pull_request:
    branches: ["master"]
    paths: ["js/**", "index.html", ".github/tests/city-smoke.mjs", ".github/workflows/city-check.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check --experimental-default-type=module js/main.js
          node --check --experimental-default-type=module js/City.js
          node --check --experimental-default-type=module js/CityWeather.js
          node --check --experimental-default-type=module js/Camera.js
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check city driving and collisions
        run: node .github/tests/city-smoke.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-browser-check
          path: artifacts/
          retention-days: 7
